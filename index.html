<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delight Cakes &amp; Pastries</title>
  <meta name="description" content="Rich chocolate cakes, brownies and pastries, baked fresh to order.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero__media" aria-hidden="true">
      <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg">
        <source src="assets/hero.mp4" type="video/mp4">
      </video>
    </div>

    <nav class="nav">
      <a class="nav__brand" href="#">Delight</a>
      <ul class="nav__links">
        <li><a href="#menu">Menu</a></li>
        <li><a href="#about">Our story</a></li>
        <li><a href="#order" class="nav__cta">Order</a></li>
      </ul>
    </nav>

    <div class="hero__content">
      <h1 class="hero__title">
        <span class="line"><span>Rich enough</span></span>
        <span class="line"><span>to make time stop.</span></span>
      </h1>
      <p class="hero__lead">Chocolate cakes, brownies and pastries, baked slow and made fresh to order.</p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="#order">Order a cake</a>
        <a class="btn btn--ghost" href="#menu">See the menu</a>
      </div>
    </div>
  </header>
</body>
</html>
